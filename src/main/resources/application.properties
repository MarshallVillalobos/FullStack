spring.application.name=perfumessus

# Conexion a MySQL (parametrizable por variables de entorno para Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/perfumessus_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Modo Debug para Flyway
logging.level.org.flywaydb=DEBUG

# Fragella API Config
fragella.base-url=https://api.fragella.com
fragella.api-key=${FRAGELLA_API_KEY:cffd3d8a44c858eeb5315b01bcacf0e160fa78f9b3792bcdc9b49f8659e9cca5}

# Clave secreta para firmar los tokens JWT (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:perfumessus-clave-secreta-jwt-2026-cambiar-en-produccion}