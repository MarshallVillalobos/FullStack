spring.application.name=perfumessus

server.port=${PORT:8080}

# Conexion a MySQL (valores sensibles por variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG

# Fragella API (sin valores por defecto: si falta, la app no arranca)
fragella.base-url=${FRAGELLA_BASE_URL}
fragella.api-key=${FRAGELLA_API_KEY}

# Spring Security - JWT
# JwtUtil lee JWT_SECRET directamente desde la variable de entorno