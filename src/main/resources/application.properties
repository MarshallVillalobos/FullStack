spring.application.name=perfumessus
 
# Conexion a MySQL local (Laragon)
spring.datasource.url=jdbc:mysql://localhost:3306/perfumessus_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
 
# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
 
# Modo Debug para Flyway
logging.level.org.flywaydb=DEBUG

# Fragella API Config
fragella.base-url=https://api.fragella.com
