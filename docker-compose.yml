services:
  mysql:
    image: mysql:8.4
    container_name: perfumessus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: perfumessus_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perfumessus-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/perfumessus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "true"
      JWT_SECRET: perfumessus-clave-secreta-jwt-2026-cambiar-en-produccion
      FRAGELLA_API_KEY: cffd3d8a44c858eeb5315b01bcacf0e160fa78f9b3792bcdc9b49f8659e9cca5
    ports:
      - "8080:8080"
    restart: unless-stopped
volumes:
  mysql_data: